
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090909">
<meta name="description" content="Goetia e Demonologia — grimórios e tradição goética.">
<title>Goetia e Demonologia</title>

<style>
:root {
  color-scheme: dark;
  --bg: #090909;
  --red: #c51c32;
  --gold: #e1c28a;
  --text: #f8f2f2;
  --muted: #c0b3b5;
  --border: #482027;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
  line-height: 1.65;
  overflow-wrap: anywhere;
}

a {
  color: inherit;
  text-decoration: none;
}

/* CAPA */
.hero {
  text-align: center;
  padding-bottom: 28px;
  background: #090909;
  border-bottom: 1px solid var(--border);
}

.hero-cover {
  width: 100%;
  height: clamp(260px, 52vw, 650px);
  overflow: hidden;
  background: #090909;
  border-bottom: 1px solid var(--border);
}

.hero-cover img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 43%;
}

.hero h1 {
  margin: 22px auto 0;
  padding: 0 16px;
  max-width: 1000px;
  font: bold clamp(32px, 5vw, 58px)/1.1 Georgia, serif;
  color: var(--gold);
  text-shadow: 0 0 25px #d31d3633;
}

.kicker {
  color: var(--gold);
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
}

/* CONTEÚDO */
main {
  width: min(1180px, 92%);
  margin: auto;
}

.section-head {
  text-align: center;
  padding: 54px 0 20px;
}

.section-head h2 {
  margin: 8px 0;
  font: bold clamp(28px, 4vw, 40px) Georgia, serif;
}

.rule {
  width: 65px;
  height: 2px;
  background: var(--red);
  margin: 20px auto;
}

/* CARDS */
.grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 22px;
  padding: 12px 0 65px;
}

.card {
  min-width: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: linear-gradient(145deg, #1a1415, #0e0d0d 78%);
  border: 1px solid var(--border);
  border-radius: 9px;
  box-shadow: 0 10px 30px #0005;
  transition: transform .25s, border-color .25s;
}

.card:hover {
  transform: translateY(-4px);
  border-color: #873040;
}

.card-media {
  height: 245px;
  background: radial-gradient(ellipse, #50111b, #110b0c 70%);
  display: flex;
  align-items: center;
  justify-content: center;
  border-bottom: 1px solid var(--border);
  padding: 20px;
}

.card-media img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  filter: invert(1) sepia(.2) saturate(2) hue-rotate(300deg);
}

.art-fallback {
  font: 65px Georgia, serif;
  color: var(--gold);
}

.card-body {
  padding: 22px;
  display: flex;
  flex-direction: column;
  flex: 1;
}

.tag {
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--gold);
}

.card h3 {
  font: bold 27px Georgia, serif;
  margin: 8px 0 12px;
}

.card p {
  font-size: 14px;
  color: #d1c5c6;
  margin: 0 0 14px;
}

.card h4 {
  font-size: 13px;
  color: white;
  margin: 7px 0;
}

.card ul {
  padding-left: 18px;
  margin: 0 0 18px;
  font-size: 13px;
  color: #c9babb;
}

.card li {
  margin: 5px 0;
}

/* PREÇOS E BOTÕES */
.price-box {
  border-top: 1px solid #382126;
  padding-top: 16px;
  margin-top: auto;
}

.price-label {
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.price {
  color: var(--gold);
  font: bold clamp(23px, 2.5vw, 29px) Georgia, serif;
  margin: 4px 0 16px;
}

.btn {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  min-height: 46px;
  padding: 12px 18px;
  border-radius: 5px;
  text-align: center;
  font-size: 13px;
  font-weight: bold;
  border: 1px solid transparent;
  transition: background .2s, transform .2s;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.btn-red {
  background: var(--red);
  color: white;
}

.btn-red:hover {
  background: #ed263e;
}

.btn:active {
  transform: scale(.98);
}

.price-box .btn {
  width: 100%;
}

/* OUTROS PACTOS */
.custom {
  margin: 0 0 60px;
  padding: clamp(24px, 5vw, 48px);
  text-align: center;
  border: 1px solid #762331;
  border-radius: 10px;
  background: radial-gradient(ellipse at top, #3a0d14, #110c0d 70%);
}

.custom h2 {
  font: bold clamp(27px, 4vw, 39px) Georgia, serif;
}

.custom .btn {
  margin: 5px;
}

/* RESPONSIVIDADE */
@media (max-width: 960px) {
  .grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 17px;
  }
}

@media (max-width: 600px) {
  .hero {
    padding-bottom: 24px;
  }

  .hero-cover {
    height: 300px;
  }

  .hero-cover img {
    object-position: center center;
  }

  main {
    width: 92%;
  }

  .grid {
    grid-template-columns: 1fr;
    gap: 18px;
  }

  .card-media {
    height: 260px;
  }

  .card-body {
    padding: 20px;
  }

  .custom .btn {
    width: 100%;
    margin: 5px 0;
  }
}

@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }

  *,
  *::before,
  *::after {
    transition: none !important;
  }
}
</style>
</head>

function criarMensagem(daemon) {
  return [
    `Olá! Quero informações sobre o pacto de ${daemon.nome}.`,
    "",
    `Sobre o daemon: ${daemon.sobre}`,
    "",
    `Pacto e benefícios atribuídos: ${daemon.pacto}`,
    "",
    "Benefícios:",
    ...daemon.beneficios.map(item => `• ${item}`),
    "",
    `Valor do pacto: ${daemon.valor}`,
    "",
    "Gostaria de receber mais informações sobre como funciona."
  ].join("\n");
}

function criarCard(daemon) {
  const artigo = document.createElement("article");
  artigo.className = "card";

  const media = document.createElement("div");
  media.className = "card-media";

  const imagem = document.createElement("img");
  imagem.src = daemon.imagem;
  imagem.alt = daemon.alt;
  imagem.loading = "lazy";
  imagem.onerror = function() {
    media.innerHTML = "";
    const fallback = document.createElement("span");
    fallback.className = "art-fallback";
    fallback.textContent = daemon.simbolo;
    media.appendChild(fallback);
  };

  media.appendChild(imagem);

  const corpo = document.createElement("div");
  corpo.className = "card-body";

  const tag = document.createElement("span");
  tag.className = "tag";
  tag.textContent = daemon.tag;

  const titulo = document.createElement("h3");
  titulo.textContent = daemon.nome;

  const sobre = document.createElement("p");
  const sobreNegrito = document.createElement("strong");
  sobreNegrito.textContent = "Sobre o daemon: ";
  sobre.appendChild(sobreNegrito);
  sobre.appendChild(document.createTextNode(daemon.sobre));

  const subtitulo = document.createElement("h4");
  subtitulo.textContent = "Pacto e benefícios atribuídos";

  const descricao = document.createElement("p");
  descricao.textContent = daemon.pacto;

  const lista = document.createElement("ul");
  daemon.beneficios.forEach(beneficio => {
    const item = document.createElement("li");
    item.textContent = beneficio;
    lista.appendChild(item);
  });

  const caixaPreco = document.createElement("div");
  caixaPreco.className = "price-box";

  const rotulo = document.createElement("span");
  rotulo.className = "price-label";
  rotulo.textContent = "Valor do pacto";

  const preco = document.createElement("div");
  preco.className = "price";
  preco.textContent = daemon.valor;

  const botao = document.createElement("a");
  botao.className = "btn btn-red";
  botao.textContent = daemon.nome === "Lilith"
    ? "CONSULTAR LILITH PELO WHATSAPP"
    : "CONSULTAR PACTO PELO WHATSAPP";

  botao.href =
    `https://wa.me/${whatsapp}?text=${encodeURIComponent(criarMensagem(daemon))}`;

  botao.target = "_blank";
  botao.rel = "noopener";

  caixaPreco.append(rotulo, preco, botao);
  corpo.append(tag, titulo, sobre, subtitulo, descricao, lista, caixaPreco);
  artigo.append(media, corpo);

  return artigo;
}

const grade = document.getElementById("lista-daemons");

daemons.forEach(daemon => {
